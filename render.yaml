# Render blueprint: the API and its PostgreSQL database. The web app is deployed separately on Vercel (apps/web/vercel.json).
# Create it from the Render dashboard: New > Blueprint > pick this repository.
databases:
  - name: everest-db
    plan: free
    databaseName: everest

services:
  - type: web
    name: everest-api
    runtime: python
    plan: free
    rootDir: services/api
    # uv installs exactly what uv.lock says; the optional vision group (ultralytics) is left out, it is too big for a free instance.
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # migrations, the starter data (safe to repeat), the demo mill (only loads into an empty database) and the read-only demo logins, then the API
    startCommand: uv run alembic upgrade head && uv run python -m scripts.seed_dev && (uv run python -m scripts.seed_demo || true) && (uv run python -m scripts.show_piece || true) && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Render fills this in from the database above; the app adds the driver name to the address itself
      - key: DATABASE_URL
        fromDatabase:
          name: everest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_KEY_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_DATA
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/uploads
