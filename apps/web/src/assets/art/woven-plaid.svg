<svg viewBox="0 0 900 600" width="900" height="600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- plain weave: threads go over and under, so the four cells of a 6px tile alternate light and dark -->
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#071a19"/>
      <rect width="3" height="3" fill="#0d2f2d"/>
      <rect x="3" y="3" width="3" height="3" fill="#0d2f2d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#071a19" stop-opacity="0"/>
      <stop offset="1" stop-color="#071a19" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#weave)"/>
  <!-- warp stripes (vertical) -->
  <g>
    <rect x="60" width="54" height="600" fill="#14b8a6" opacity="0.16"/>
    <rect x="240" width="54" height="600" fill="#14b8a6" opacity="0.16"/>
    <rect x="420" width="54" height="600" fill="#14b8a6" opacity="0.16"/>
    <rect x="600" width="54" height="600" fill="#14b8a6" opacity="0.16"/>
    <rect x="780" width="54" height="600" fill="#14b8a6" opacity="0.16"/>
    <rect x="124" width="3" height="600" fill="#5eead4" opacity="0.28"/>
    <rect x="304" width="3" height="600" fill="#5eead4" opacity="0.28"/>
    <rect x="484" width="3" height="600" fill="#5eead4" opacity="0.28"/>
    <rect x="664" width="3" height="600" fill="#5eead4" opacity="0.28"/>
    <rect x="844" width="3" height="600" fill="#5eead4" opacity="0.28"/>
  </g>
  <!-- weft stripes (horizontal) -->
  <g>
    <rect y="50" width="900" height="44" fill="#14b8a6" opacity="0.14"/>
    <rect y="230" width="900" height="44" fill="#14b8a6" opacity="0.14"/>
    <rect y="410" width="900" height="44" fill="#14b8a6" opacity="0.14"/>
    <rect y="104" width="900" height="3" fill="#5eead4" opacity="0.28"/>
    <rect y="284" width="900" height="3" fill="#5eead4" opacity="0.28"/>
    <rect y="464" width="900" height="3" fill="#5eead4" opacity="0.28"/>
  </g>
  <rect width="900" height="600" fill="url(#fade)"/>
</svg>
