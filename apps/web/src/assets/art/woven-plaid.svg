<svg viewBox="0 0 900 900" width="900" height="900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- twill: fine diagonal ribs, the way a woven cloth catches the light -->
    <pattern id="twill" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#0e251b"/>
      <rect width="2" height="5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <pattern id="twill-light" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="1.4" height="4" fill="#000000" opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#0b1e16" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1e16" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#twill)"/>
  <!-- warp bands (vertical) -->
  <g fill="#658c58">
    <rect x="40" width="90" height="900" opacity="0.22"/>
    <rect x="270" width="90" height="900" opacity="0.2"/>
    <rect x="500" width="90" height="900" opacity="0.22"/>
    <rect x="730" width="90" height="900" opacity="0.2"/>
  </g>
  <g fill="#9db58f" opacity="0.2">
    <rect x="198" width="2" height="900"/>
    <rect x="428" width="2" height="900"/>
    <rect x="658" width="2" height="900"/>
  </g>
  <!-- weft bands (horizontal) -->
  <g fill="#658c58">
    <rect y="80" width="900" height="80" opacity="0.2"/>
    <rect y="330" width="900" height="70" opacity="0.2"/>
    <rect y="470" width="900" height="70" opacity="0.18"/>
    <rect y="700" width="900" height="80" opacity="0.2"/>
  </g>
  <g fill="#9db58f" opacity="0.2">
    <rect y="240" width="900" height="2"/>
    <rect y="600" width="900" height="2"/>
  </g>
  <rect width="900" height="900" fill="url(#twill-light)"/>
  <rect width="900" height="900" fill="url(#fade)"/>
</svg>
